<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoltStudy Login</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='voltstudy-logo.svg') }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='voltstudy-icon-192.png') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="apple-touch-icon" sizes="192x192" href="{{ url_for('static', filename='voltstudy-icon-192.png') }}">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .box {
            width: 360px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        }
        h2 {
            margin-top: 0;
            text-align: center;
        }
        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 12px;
            display: grid;
            place-items: center;
            border-radius: 18px;
            object-fit: cover;
            box-shadow: 0 12px 24px rgba(124, 58, 237, 0.3);
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        input, select {
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
        }
        button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        .error {
            color: #fca5a5;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .link {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
        }
        a {
            color: #c4b5fd;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="box">
        <img class="logo" src="{{ url_for('static', filename='voltstudy-logo.svg') }}" alt="VoltStudy logo">
        <h2>VoltStudy</h2>
        <p style="text-align:center; color:#cbd5e1; margin-top:-8px; margin-bottom:18px;">{{ "Create account" if mode == "signup" else "Login" }}</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <select name="role" required>
                <option value="Student">Student</option>
                <option value="Teacher">Teacher</option>
                <option value="Professional">Professional</option>
                <option value="Other">Other</option>
            </select>
            <button type="submit">
                {{ "Sign up" if mode == "signup" else "Login" }}
            </button>
        </form>

        <div class="link">
            {% if mode == "login" %}
                New here? <a href="{{ url_for('signup') }}">Create account</a>
            {% else %}
                Already have an account? <a href="{{ url_for('login') }}">Login</a>
            {% endif %}
        </div>
    </div>
</body>
</html>
